<ion-header>
  <ion-toolbar>
    <ion-title>Nuevo perrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>

    <ion-item>
      <ion-label position="stacked">Nombre</ion-label>
      <ion-input [(ngModel)]="nombre" name="nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Raza</ion-label>
      <ion-input [(ngModel)]="raza" name="raza"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Edad</ion-label>
      <ion-input [(ngModel)]="edad" name="edad"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Sexo</ion-label>
      <ion-input [(ngModel)]="sexo" name="sexo"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Tamaño</ion-label>
      <ion-input [(ngModel)]="tamano" name="tamano"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Descripción</ion-label>
      <ion-textarea [(ngModel)]="descripcion" name="descripcion"></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label>Vacunada</ion-label>
      <ion-toggle [(ngModel)]="vacunada" name="vacunada"></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-label>Adoptado</ion-label>
      <ion-toggle [(ngModel)]="adoptado" name="adoptado"></ion-toggle>
    </ion-item>

  </ion-list>

  <ion-button expand="block" (click)="guardar()">
    Guardar perrito
  </ion-button>

</ion-content>
